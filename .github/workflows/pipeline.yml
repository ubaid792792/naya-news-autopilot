name: pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "live = collect + publish, collect = fill queue only, test = preview only"
        type: choice
        options: [test, live, collect]
        default: test
      run_id:
        description: "Run id from the control panel (leave empty for manual runs)"
        type: string
        default: ""
      trigger:
        type: string
        default: manual
      article_url:
        description: "Optional: make a post from this one article"
        type: string
        default: ""

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Run pipeline
        run: python -m pipeline.main
        env:
          MODE: ${{ inputs.mode }}
          RUN_ID: ${{ inputs.run_id }}
          TRIGGER: ${{ inputs.trigger }}
          ARTICLE_URL: ${{ inputs.article_url }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          QUEUE_URL: ${{ secrets.QUEUE_URL }}
